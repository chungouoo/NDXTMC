name: iPhone 一键生成晨报数据包

"on":
  schedule:
    # UTC: 07:23 and 07:41 the next day in Asia/Shanghai.
    - cron: '23 23 * * *'
    - cron: '41 23 * * *'
  workflow_dispatch:
  public:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - requirements.txt
      - .github/workflows/generate.yml
      - .github/ndxtmc-trigger.json

permissions:
  contents: read

concurrency:
  group: morning-data-pack
  cancel-in-progress: false

jobs:
  generate:
    name: 校验、抓取 Nasdaq、发布 ZIP
    # A private repository job would consume the account's shared included
    # compute allowance. Never allocate a runner unless the repository is public.
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check for a successful handoff today
        id: today
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Shanghai date +%F)
          if payload=$(gh api "repos/$GH_REPO/contents/data/latest_morning_input.json?ref=main" --jq .content | base64 --decode) &&
             completed_run=$(jq -r --arg today "$today" '
               select(.beijing_request_date == $today and .status == "READY"
                 and .data.daily_ready == true and .validation.errors == []
                 and .manifest.quality_gate == "PASS" and .manifest.source_mode == "LIVE")
               | .pipeline.run_id' <<< "$payload") &&
             [[ "$completed_run" =~ ^[0-9]+$ ]] &&
             conclusion=$(gh api "repos/$GH_REPO/actions/runs/$completed_run" --jq .conclusion) &&
             [[ "$conclusion" == success ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.today.outputs.ready != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned dependencies without an Actions cache
        if: steps.today.outputs.ready != 'true'
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Test market sessions and data failure checks
        if: steps.today.outputs.ready != 'true'
        run: python -m unittest discover -s tests -v

      - name: Download and independently validate the latest completed session
        if: steps.today.outputs.ready != 'true'
        run: python -m scripts.morning_pack --output output

      - name: Publish downloadable data pack
        if: steps.today.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          trade_date=$(python -c 'import json; s=json.load(open("output/summary.json")); assert s["daily_ready"] is True; print(s["as_of_date"])')
          tag="data-${trade_date}-${RUN_ID}-${RUN_ATTEMPT}"
          gh release create "$tag" \
            output/LATEST_Morning_Report_Data_Pack.zip \
            output/LATEST_Morning_Report_Data_Pack.zip.sha256 \
            output/Nasdaq_Source_Audit.zip \
            output/validation.json \
            --repo "$GH_REPO" \
            --target "$SOURCE_SHA" \
            --title "纳指晨报数据包 · ${trade_date}" \
            --notes-file output/release_notes.md \
            --latest
          cat output/release_notes.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n[下载最新 ZIP](https://github.com/%s/releases/latest/download/LATEST_Morning_Report_Data_Pack.zip)\n' "$GH_REPO" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish validated input for the morning report
        if: steps.today.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python -m scripts.publish_handoff --output output

      - name: Show failure evidence
        if: ${{ failure() }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ["## 本次未发布新数据包", "", "检查失败步骤日志；上次成功的 Release 会保留原交易日。"]
          p = Path("output/failure.json")
          if p.exists():
              failure = json.loads(p.read_text())
              lines += ["", "```json", json.dumps(failure, ensure_ascii=False, indent=2), "```"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY
